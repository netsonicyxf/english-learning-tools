<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS 写作</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#173b78;--coral:#ff655d;--sun:#ffd43b;--leaf:#49bd68;--cream:#fff4d8;--white:#fffaf0;--ink:#17345f;--muted:#6d6a61}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 4px 0 rgba(23,59,120,.35)}
.title-area{flex:1;min-width:0;color:var(--cream)}
.article-title{font-size:16px;font-weight:800}
.article-meta{font-size:12px;color:rgba(255,244,216,.75);margin-top:2px}
.controls{display:flex;gap:10px;align-items:center;flex-shrink:0}
.btn{padding:8px 18px;border-radius:9px 12px 8px 11px;border:2px solid var(--navy);font-size:14px;cursor:pointer;font-weight:700;background:var(--white);color:var(--navy)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--navy)}
.btn-primary{background:var(--navy);color:var(--cream);box-shadow:3px 3px 0 var(--sun)}
.timer-box{display:flex;align-items:center;gap:8px;background:var(--white);border:2.5px solid var(--navy);border-radius:14px;padding:10px 18px;max-width:1000px;margin:18px auto 0;font-family:Georgia,serif}
.timer-label{font-size:13px;color:var(--muted);font-family:-apple-system,sans-serif}
.timer{font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.timer.warn{color:#e8590c}
.timer.danger{color:#e03131;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.timer-btns{margin-left:auto;display:flex;gap:8px}
.timer-btns button{padding:5px 12px;font-size:12px;border:1.5px solid var(--navy);border-radius:8px;background:var(--cream);cursor:pointer;font-weight:700;color:var(--navy)}
.wrap{max-width:1000px;margin:16px auto;padding:0 18px}
.topic-card{background:var(--white);border:2.5px solid var(--navy);border-radius:18px 24px 16px 22px;padding:20px 26px;box-shadow:6px 7px 0 rgba(23,59,120,.8);margin-bottom:16px}
.topic-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--navy);background:#d6ecff;padding:3px 10px;border-radius:10px;margin-bottom:8px}
.topic-text{font-size:17px;font-weight:600;color:#1a1a2e;line-height:1.7}
.editor{border:2.5px solid var(--navy);border-radius:18px 24px 16px 22px;background:var(--white);box-shadow:6px 7px 0 rgba(23,59,120,.8);overflow:hidden}
.editor-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--sun);border-bottom:2px solid var(--navy);font-size:13px;color:var(--ink);font-weight:600}
#essay{width:100%;min-height:420px;border:none;outline:none;padding:20px 24px;font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.9;color:#2d3748;resize:vertical}
.submit-row{display:flex;justify-content:center;gap:12px;margin:18px 0 40px}
.btn-submit{background:var(--leaf);color:#fff;border-color:var(--navy);box-shadow:3px 3px 0 var(--navy);padding:12px 32px;font-size:16px}
.btn-submit:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--coral)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-bottom:30px}
.overlay{position:fixed;inset:0;background:rgba(23,52,95,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:18px}
.overlay.hidden{display:none}
.modal{background:var(--white);border:2.5px solid var(--navy);border-radius:18px 24px 16px 22px;box-shadow:6px 7px 0 rgba(23,59,120,.8);max-width:400px;width:100%;padding:24px 26px}
.modal h3{font-size:17px;color:var(--navy);margin-bottom:4px}
.modal .modal-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.preset{padding:6px 14px;font-size:13px;font-weight:700;border:1.5px solid var(--navy);border-radius:9px;background:var(--cream);color:var(--navy);cursor:pointer}
.preset:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--navy)}
.preset.active{background:var(--sun)}
.min-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.min-row input{width:90px;padding:8px 10px;font-size:16px;font-weight:700;color:var(--navy);border:2px solid var(--navy);border-radius:9px;background:var(--white);font-family:Georgia,serif;text-align:center}
.min-row span{font-size:14px;color:var(--ink)}
.modal-err{font-size:12px;color:#e03131;min-height:18px;margin:2px 0 10px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
<header class="top-bar">
  <div class="title-area">
    <div class="article-title">雅思写作练习</div>
    <div class="article-meta" id="meta"></div>
  </div>
  <div class="controls">
    <button class="btn" id="clear-btn">清空</button>
  </div>
</header>
<div class="timer-box">
  <span class="timer-label">剩余时间</span>
  <span class="timer" id="timer">--:--</span>
  <div class="timer-btns">
    <button id="set-btn">改时间</button>
    <button id="pause-btn">暂停</button>
    <button id="reset-btn">重置</button>
  </div>
</div>
<div class="wrap">
  <div class="topic-card">
    <span class="topic-tag" id="task-tag">Task 2</span>
    <div class="topic-text" id="topic"></div>
  </div>
  <div class="editor">
    <div class="editor-bar"><span>在此写作（建议 250+ 词 / Task 2）</span><span id="stat">0 词 · 0 段</span></div>
    <textarea id="essay" placeholder="开始写你的作文…写完后点下方「提交」，会自动复制到剪贴板，再粘贴回对话框即可批改。"></textarea>
  </div>
  <div class="submit-row">
    <button class="btn btn-submit" id="submit-btn">提交（复制作文）</button>
  </div>
  <div class="hint">提交后会复制整篇作文到剪贴板，请粘贴到对话窗口交给 agent 批改。</div>
</div>
<div class="overlay hidden" id="time-overlay">
  <div class="modal">
    <h3>设置倒计时时长</h3>
    <div class="modal-sub">考试建议：Task 1 约 20 分钟 · Task 2 约 40 分钟</div>
    <div class="preset-row" id="preset-row">
      <button class="preset" data-min="20">20 分钟</button>
      <button class="preset" data-min="40">40 分钟</button>
      <button class="preset" data-min="45">45 分钟</button>
      <button class="preset" data-min="60">60 分钟</button>
    </div>
    <div class="min-row">
      <input type="number" id="min-input" min="1" max="240" step="1" value="45">
      <span>分钟</span>
    </div>
    <div class="modal-err" id="modal-err"></div>
    <div class="modal-actions">
      <button class="btn" id="time-cancel" style="display:none">取消</button>
      <button class="btn btn-primary" id="time-ok">开始计时</button>
    </div>
  </div>
</div>
<script>
const WRITER_DATA = Object.assign(
  {id:'ielts', topic:'（未提供题目）', task:'task2', minutes:45},
  {{WRITER_DATA_JSON}},
  parseHash()
);
function parseHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h) return {};
  const p=new URLSearchParams(h);
  const out={};
  // URLSearchParams already percent-decodes; decoding again breaks topics
  // containing a literal % (e.g. "50% of people") with URIError.
  if(p.get('topic')) out.topic=p.get('topic');
  if(p.get('task')) out.task=p.get('task');
  if(p.get('minutes')) out.minutes=parseInt(p.get('minutes'))||45;
  return out;
}
const $topic=document.getElementById('topic');
const $taskTag=document.getElementById('task-tag');
const $meta=document.getElementById('meta');
const $essay=document.getElementById('essay');
const $timer=document.getElementById('timer');
const $stat=document.getElementById('stat');
const $pauseBtn=document.getElementById('pause-btn');

document.title='写作: '+(WRITER_DATA.topic||'').substring(0,30);
$topic.textContent=WRITER_DATA.topic;
$taskTag.textContent=WRITER_DATA.task==='task1'?'Task 1':'Task 2';
$meta.textContent='题目已载入 · 请设置倒计时';

let total=0;
let left=0; let running=false; let iv=null;
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function paint(){
  if(!total){ $timer.textContent='--:--'; $timer.classList.remove('warn','danger'); return; }
  $timer.textContent=fmt(left);
  $timer.classList.toggle('warn', left<=300 && left>60);
  $timer.classList.toggle('danger', left<=60);
}
function tick(){
  if(!running) return;
  left=Math.max(0,left-1); paint();
  if(left===0){ running=false; clearInterval(iv); alert('时间到！可直接提交，或点「重置」再练。'); }
}
function start(){ clearInterval(iv); iv=setInterval(tick,1000); }

const LS_MIN_KEY='ielts_writer_minutes';
const $overlay=document.getElementById('time-overlay');
const $minInput=document.getElementById('min-input');
const $modalErr=document.getElementById('modal-err');
const $timeOk=document.getElementById('time-ok');
const $timeCancel=document.getElementById('time-cancel');
let editMode=false, prevLeft=0, prevRunning=false;
function savedMinutes(){ try{ const v=parseInt(localStorage.getItem(LS_MIN_KEY),10); return (v>0)?v:null; }catch(e){ return null; } }
function defaultMinutes(){
  if(total) return Math.round(total/60);          // 改时间：预填当前时长
  const s=savedMinutes(); if(s) return s;         // 上次用的
  const m=parseInt(WRITER_DATA.minutes,10); return (m>0)?m:45;  // 数据/URL 给的默认
}
function markPreset(){
  const v=String(parseInt($minInput.value,10));
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active', b.dataset.min===v));
}
function openModal(edit){
  editMode=!!edit;
  prevLeft=left; prevRunning=running;
  running=false; $pauseBtn.textContent='暂停';
  $minInput.value=defaultMinutes(); markPreset();
  $modalErr.textContent='';
  $timeCancel.style.display=editMode?'':'none';
  $timeOk.textContent=editMode?'开始新的倒计时':'开始计时';
  $overlay.classList.remove('hidden');
  $minInput.focus(); $minInput.select();
}
function applyMinutes(){
  const m=parseInt($minInput.value,10);
  if(!(m>0)||m>240){ $modalErr.textContent='请输入 1–240 之间的分钟数'; return; }
  try{ localStorage.setItem(LS_MIN_KEY,String(m)); }catch(e){}
  total=m*60; left=total; running=true; $pauseBtn.textContent='暂停';
  $meta.textContent='题目已载入 · 倒计时 '+m+' 分钟';
  paint(); start(); $overlay.classList.add('hidden');
}
$timeOk.addEventListener('click',applyMinutes);
$minInput.addEventListener('input',markPreset);
$minInput.addEventListener('keydown',e=>{ if(e.key==='Enter')applyMinutes(); });
$timeCancel.addEventListener('click',()=>{
  left=prevLeft; running=prevRunning&&total>0; if(running)start();
  paint(); $overlay.classList.add('hidden');
});
$overlay.addEventListener('click',e=>{ if(e.target===$overlay&&editMode) $timeCancel.click(); });
document.getElementById('preset-row').addEventListener('click',e=>{
  const b=e.target.closest('.preset'); if(!b) return;
  $minInput.value=b.dataset.min; markPreset(); applyMinutes();
});
document.getElementById('set-btn').addEventListener('click',()=>openModal(true));
paint(); openModal(false);

$essay.addEventListener('input',()=>{
  const t=$essay.value.trim();
  const words=t?t.split(/\s+/).length:0;
  const paras=t?t.split(/\n\s*\n/).filter(Boolean).length:0;
  $stat.textContent=words+' 词 · '+paras+' 段';
});
$pauseBtn.addEventListener('click',()=>{ if(!total)return; running=!running; $pauseBtn.textContent=running?'暂停':'继续'; if(running)start(); });
document.getElementById('reset-btn').addEventListener('click',()=>{ if(!total)return; left=total; running=true; $pauseBtn.textContent='暂停'; paint(); start(); });
document.getElementById('clear-btn').addEventListener('click',()=>{ if(confirm('清空当前作文？')){ $essay.value=''; $stat.textContent='0 词 · 0 段'; } });
document.getElementById('submit-btn').addEventListener('click',()=>{
  const essay=$essay.value.trim();
  if(!essay){ alert('作文为空'); return; }
  const block='[IELTS 作文]\ntopic: '+(WRITER_DATA.topic||'')+'\ntask: '+WRITER_DATA.task+'\nessay:\n'+essay+'\n[/IELTS 作文]';
  navigator.clipboard.writeText(block).then(ok=>{
    alert('已复制作文到剪贴板（'+essay.split(/\s+/).length+' 词）。\n请粘贴回对话框交给 agent 批改。');
  }).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=block; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); alert('已复制，请粘贴回对话框。');}catch(e){ alert('复制失败，请手动复制：\n\n'+block); }
    document.body.removeChild(ta);
  });
});
</script>
</body>
</html>
