<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Reading</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:#f5f6f7;color:#1a1a2e;line-height:1.6}

/* ===== TOP BAR ===== */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.title-area{flex:1;min-width:0}
.article-title{font-size:18px;font-weight:600;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.article-meta{font-size:12px;color:#8b95a5;margin-top:2px}
.controls{display:flex;gap:10px;align-items:center;flex-shrink:0}
.btn{padding:8px 18px;border-radius:8px;border:1px solid #d0d5dd;font-size:14px;cursor:pointer;transition:all .15s;font-weight:500;background:#fff;color:#344054}
.btn:hover{background:#f9fafb;border-color:#98a2b3}
.btn-primary{background:#4263eb;color:#fff;border-color:#4263eb}
.btn-primary:hover{background:#3b56d6;border-color:#3b56d6}

/* ===== READING VIEW ===== */
.reading-view{display:flex;gap:24px;padding:24px;max-width:1100px;margin:0 auto}
.article-area{flex:1;min-width:0;background:#fff;border-radius:12px;padding:28px 36px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-family:Georgia,'Times New Roman',serif}
.article-area h2{font-size:22px;font-weight:700;margin:28px 0 16px;color:#1a1a2e;font-family:-apple-system,sans-serif}
.article-area h3{font-size:18px;font-weight:600;margin:24px 0 12px;color:#1a1a2e;font-family:-apple-system,sans-serif}
.article-area p{font-size:17px;line-height:1.85;margin-bottom:18px;color:#2d3748}
.article-area blockquote{border-left:3px solid #4263eb;padding-left:16px;margin:18px 0;color:#5a6577;font-style:italic}
.article-area a{color:#4263eb;text-decoration:underline}

/* ===== WORD BANK ===== */
.word-bank-panel{width:280px;flex-shrink:0;display:flex;flex-direction:column}
.word-bank-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-radius:12px 12px 0 0;border:1px solid #e5e7eb;border-bottom:none}
.word-bank-header h2{font-size:15px;font-weight:600;color:#344054;display:flex;align-items:center;gap:6px}
.word-count-badge{background:#e0e7ff;color:#4263eb;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px}
.word-list-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:0 0 12px 12px;overflow-y:auto;max-height:calc(100vh - 180px);padding:12px}
.word-list{display:flex;flex-direction:column;gap:8px}
.word-card{background:#f9fafb;border-radius:8px;padding:10px 12px;position:relative;border:1px solid #e9ecef;transition:all .15s;animation:cardIn .3s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.word-text{font-weight:600;font-size:14px;color:#1a1a2e;font-family:Georgia,serif}
.word-translation{font-size:13px;color:#5a6577;margin-top:3px}
.word-context{font-size:12px;color:#8b95a5;margin-top:5px;font-style:italic;line-height:1.4}
.word-remove{position:absolute;top:6px;right:6px;width:22px;height:22px;border:none;background:none;cursor:pointer;color:#bbb;font-size:18px;line-height:1;border-radius:4px;transition:all .15s}
.word-remove:hover{color:#e03131;background:#fee}
.empty-hint{color:#8b95a5;font-size:13px;padding:20px 8px;text-align:center;line-height:1.6}

/* ===== WORD HIGHLIGHT ===== */
.word-highlight{background:#fef3c7;border-radius:3px;padding:1px 2px;transition:background .2s;cursor:pointer}
.word-highlight:hover{background:#fde68a}

/* ===== TOOLTIP ===== */
.tooltip{display:none;position:fixed;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:1000;max-width:320px;transition:opacity .1s}
.tooltip-original{font-size:12px;color:#8b95a5;margin-bottom:3px;font-family:Georgia,serif;border-bottom:1px dashed #e5e7eb;padding-bottom:6px}
.tooltip-translation{font-size:15px;font-weight:500;color:#1a1a2e}
.tooltip-hint{font-size:11px;color:#2f9e44;margin-top:6px;font-weight:500}

/* ===== EXERCISE VIEW ===== */
.exercise-view{display:none;padding:24px;max-width:1100px;margin:0 auto}
.exercise-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 18px;border:1px solid #d0d5dd;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:#344054;transition:all .15s}
.tab:hover{background:#f9fafb;border-color:#98a2b3}
.tab.active{background:#4263eb;color:#fff;border-color:#4263eb}
.exercise-content{background:#fff;border-radius:12px;padding:28px 36px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.exercise-header{margin-bottom:24px}
.exercise-header h2{font-size:20px;font-weight:600;color:#1a1a2e}
.exercise-header p{font-size:14px;color:#8b95a5;margin-top:4px}
.exercise-empty{text-align:center;padding:40px 20px;color:#8b95a5}
.exercise-empty p:first-child{font-size:16px;font-weight:500;color:#344054}
.exercise-empty .sub{font-size:13px;margin-top:8px}
.exercise-actions{display:flex;gap:10px;margin-top:20px}
.summary-bar{background:#e0e7ff;color:#4263eb;padding:12px 16px;border-radius:8px;font-weight:600;font-size:14px;margin-top:16px;text-align:center}

/* ===== WORD EXERCISE ===== */
.word-exercise-list{display:flex;flex-direction:column;gap:20px}
.word-question{display:flex;gap:16px;align-items:flex-start}
.question-num{width:32px;height:32px;background:#e0e7ff;color:#4263eb;border-radius:8px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.question-body{flex:1;min-width:0}
.question-word{font-size:17px;font-weight:600;color:#1a1a2e;font-family:Georgia,serif;margin-bottom:4px}
.question-context{font-size:12px;color:#8b95a5;font-style:italic;margin-bottom:10px;line-height:1.4}
.question-options{display:flex;gap:8px;flex-wrap:wrap}
.option-btn{padding:8px 14px;border:1px solid #d0d5dd;background:#fff;border-radius:8px;cursor:pointer;font-size:13px;color:#344054;transition:all .15s;font-family:inherit}
.option-btn:hover:not(:disabled){background:#f9fafb;border-color:#98a2b3}
.option-btn:disabled{cursor:default;opacity:.7}
.option-btn.correct{background:#d3f9d8;color:#2f9e44;border-color:#2f9e44;opacity:1!important;font-weight:500}
.option-btn.selected-correct{background:#2f9e44;color:#fff;border-color:#2f9e44;opacity:1!important}
.option-btn.selected-wrong{background:#fee;color:#e03131;border-color:#e03131;opacity:1!important}
.option-btn.pat-selected{border-color:#4263eb;background:#e0e7ff}
.question-feedback{font-size:13px;margin-top:8px;font-weight:500}
.question-feedback.correct{color:#2f9e44}
.question-feedback.wrong{color:#e03131}
/* word exercise v2: mixed types + context highlight */
.ctx-highlight{background:#fde68a;color:#92400e;padding:1px 3px;border-radius:3px;font-weight:600;font-style:normal}
.word-blank{display:inline-block;min-width:70px;border-bottom:2px solid #4263eb;text-align:center;color:#4263eb;font-weight:600;background:#f0f4ff;padding:0 6px;border-radius:3px}
.question-meaning{font-size:17px;font-weight:600;color:#1a1a2e;margin-bottom:6px}
.question-instruction{font-size:12px;color:#8b95a5;margin-bottom:8px;font-style:normal}
.qtype-badge{display:inline-block;font-size:10px;font-weight:700;color:#4263eb;background:#e0e7ff;padding:2px 7px;border-radius:10px;margin-bottom:8px;letter-spacing:.5px}
.cloze-context{font-size:15px!important;color:#2d3748!important;font-style:italic;line-height:1.7;margin-bottom:10px}

/* ===== CLOZE EXERCISE ===== */
.cloze-text{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:2;color:#2d3748;margin-bottom:24px}
.cloze-blank{display:inline-block;min-width:80px;border-bottom:2px dashed #4263eb;padding:2px 8px;text-align:center;color:#4263eb;font-weight:500;font-family:-apple-system,sans-serif;cursor:pointer;transition:all .15s;border-radius:4px;font-size:15px;background:#f0f4ff}
.cloze-blank:hover{background:#e0e7ff}
.cloze-blank.filled{border-bottom-style:solid;background:#e0e7ff;font-family:inherit}
.cloze-blank.correct{border-color:#2f9e44;background:#d3f9d8;color:#2f9e44}
.cloze-blank.wrong{border-color:#e03131;background:#fee;color:#e03131}
.cloze-bank{display:flex;gap:10px;flex-wrap:wrap;padding:16px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb}
.cloze-word{padding:8px 14px;border:1px solid #d0d5dd;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;color:#344054;transition:all .15s;font-weight:500}
.cloze-word:hover:not(.used){background:#e0e7ff;border-color:#4263eb;color:#4263eb}
.cloze-word.selected{background:#4263eb;color:#fff;border-color:#4263eb}
.cloze-word.used{opacity:.35;cursor:default;background:#f3f4f6;border-color:#e5e7eb}

/* ===== REORDER EXERCISE ===== */
.reorder-section{margin-bottom:32px}
.reorder-title{font-size:16px;font-weight:600;color:#344054;margin-bottom:12px}
.reorder-list{display:flex;flex-direction:column;gap:0;border-radius:8px;border:1px solid #e5e7eb;background:#f9fafb;overflow:hidden}
.reorder-item{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb;cursor:grab;transition:background .15s;user-select:none}
.reorder-item:last-child{border-bottom:none}
.reorder-item:hover{background:#f0f4ff}
.reorder-item.dragging{background:#e0e7ff;opacity:.7;cursor:grabbing}
.drag-handle{color:#8b95a5;font-size:18px;flex-shrink:0;font-weight:700;letter-spacing:-2px}
.reorder-text{font-family:Georgia,serif;font-size:15px;color:#2d3748;flex:1}
.reorder-item.correct .reorder-text{color:#2f9e44}
.reorder-item.wrong .reorder-text{color:#e03131}
.reorder-item.correct{background:#d3f9d8!important;border-color:#b2f2bb}
.reorder-item.wrong{background:#fee!important;border-color:#fcc}

/* ===== CONCEPT MAP ===== */
.concept-map-container{margin-bottom:16px;display:flex;justify-content:center}
.concept-map-svg{width:100%;max-width:800px;height:auto;border:1px solid #e5e7eb;border-radius:8px;background:#fafbfc}
.node-label{font-size:13px;font-weight:600;fill:#4263eb;font-family:-apple-system,sans-serif}
.edge-label{font-size:11px;fill:#5a6577;font-family:-apple-system,sans-serif}
.blank-input{width:100%;height:100%;border:1px solid #f08c00;border-radius:4px;background:#fef3c7;text-align:center;font-size:12px;color:#1a1a2e;outline:none;font-family:-apple-system,sans-serif}
.blank-input:focus{border-color:#4263eb;box-shadow:0 0 0 2px #e0e7ff}
.blank-input.input-correct{background:#d3f9d8;border-color:#2f9e44;color:#2f9e44}
.blank-input.input-wrong{background:#fee;border-color:#e03131;color:#e03131}
/* concept map v2: dropdown selects + relationship summary */
.blank-select{width:100%;height:100%;border:1px solid #f08c00;border-radius:4px;background:#fef3c7;text-align:center;font-size:12px;color:#1a1a2e;outline:none;font-family:-apple-system,sans-serif;cursor:pointer;appearance:auto}
.blank-select:focus{border-color:#4263eb;box-shadow:0 0 0 2px #e0e7ff}
.blank-select.select-correct{background:#d3f9d8;border-color:#2f9e44;color:#2f9e44}
.blank-select.select-wrong{background:#fee;border-color:#e03131;color:#e03131}
.concept-explanation{margin-top:16px;padding:16px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb}
.concept-explanation h3{font-size:14px;font-weight:600;color:#344054;margin-bottom:10px}
.rel-item{font-size:13px;color:#5a6577;line-height:2;font-family:Georgia,serif}
.rel-arrow{color:#4263eb;font-weight:600;margin:0 6px;font-family:-apple-system,sans-serif;font-size:12px}
/* ===== PATTERN EXERCISE ===== */
.pattern-card{background:#f9fafb;border-radius:8px;padding:16px 20px;margin-bottom:16px;border-left:3px solid #4263eb}
.pattern-name{font-size:16px;font-weight:700;color:#4263eb;margin-bottom:6px;font-family:Georgia,serif}
.pattern-formula{font-size:13px;color:#344054;margin-bottom:8px;font-style:italic;background:#e0e7ff;padding:4px 10px;border-radius:4px;display:inline-block}
.pattern-explanation{font-size:13px;color:#5a6577;margin-bottom:10px;line-height:1.6}
.pattern-source{font-size:14px;color:#2d3748;font-family:Georgia,serif;padding:10px 14px;background:#fff;border-radius:6px;border:1px solid #e5e7eb;line-height:1.7}
.pattern-cloze{margin-bottom:28px;padding:16px 20px;background:#fff;border-radius:8px;border:1px solid #e5e7eb}

/* ===== RECITATION ===== */
.recite-card{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.recite-title{font-size:16px;font-weight:600;color:#344054;margin-bottom:4px}
.recite-hint{font-size:12px;color:#8b95a5;margin-bottom:14px}
.recite-text{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:2;color:#2d3748;padding:16px 20px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb;margin-bottom:14px;transition:all .3s}
.recite-text.hidden{filter:blur(8px);user-select:none;cursor:pointer;transition:filter .3s}
.recite-text.hidden:hover{filter:blur(4px)}
.recite-actions{display:flex;gap:10px;flex-wrap:wrap}
.recite-btn{padding:8px 18px;border-radius:8px;border:1px solid #d0d5dd;font-size:14px;cursor:pointer;font-weight:500;background:#fff;color:#344054;transition:all .15s;display:flex;align-items:center;gap:6px}
.recite-btn:hover{background:#f9fafb;border-color:#98a2b3}
.recite-btn.primary{background:#4263eb;color:#fff;border-color:#4263eb}
.recite-btn.primary:hover{background:#3b56d6;border-color:#3b56d6}
.recite-btn.speaking{background:#fef3c7;border-color:#f08c00;color:#92400e}
.recite-status{font-size:13px;color:#8b95a5;margin-top:8px;font-style:italic}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .reading-view{flex-direction:column;padding:16px}
  .word-bank-panel{width:100%}
  .word-list-wrap{max-height:300px}
  .article-area{padding:20px 24px}
  .exercise-content{padding:20px 24px}
}
@media(max-width:600px){
  .top-bar{padding:10px 14px;flex-wrap:wrap;gap:10px}
  .controls{width:100%;justify-content:flex-end}
  .article-area{padding:16px 18px}
  .article-area p{font-size:15px;line-height:1.75}
}
</style>
</head>
<body>
<div class="app">

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="title-area">
      <h1 class="article-title"></h1>
      <span class="article-meta"></span>
    </div>
    <div class="controls">
      <button class="btn" id="export-btn">导出单词本</button>
      <button class="btn btn-primary" id="view-toggle-btn">生成练习</button>
    </div>
  </header>

  <!-- Reading View -->
  <main class="reading-view" id="reading-view">
    <article class="article-area" id="article-area"></article>
    <aside class="word-bank-panel">
      <div class="word-bank-header">
        <h2>单词本</h2>
        <span class="word-count-badge" id="word-count">0</span>
      </div>
      <div class="word-list-wrap">
        <div class="word-list" id="word-list"></div>
      </div>
    </aside>
  </main>

  <!-- Exercise View -->
  <main class="exercise-view" id="exercise-view">
    <div class="exercise-tabs">
      <button class="tab active" data-tab="words">单词释义</button>
      <button class="tab" data-tab="patterns">句型</button>
      <button class="tab" data-tab="cloze">摘要完形</button>
      <button class="tab" data-tab="reorder">句子重排</button>
      <button class="tab" data-tab="concept">概念关系图</button>
      <button class="tab" data-tab="recite">背诵</button>
    </div>
    <div class="exercise-content" id="exercise-content"></div>
  </main>

</div>

<!-- Translation Tooltip -->
<div class="tooltip" id="tooltip"></div>

<script>
// ============================================================
// ARTICLE DATA (AI-generated JSON below)
// ============================================================
const ARTICLE_DATA = {{ARTICLE_DATA_JSON}};
const STORAGE_KEY = 'er_wordbank_' + ARTICLE_DATA.id;

// ============================================================
// STATE
// ============================================================
let wordBank = [];
let currentTab = 'words';
let selectedClozeWord = null;

// ============================================================
// DOM REFS
// ============================================================
const $article     = document.getElementById('article-area');
const $wordList    = document.getElementById('word-list');
const $wordCount   = document.getElementById('word-count');
const $tooltip     = document.getElementById('tooltip');
const $readingView = document.getElementById('reading-view');
const $exerciseView= document.getElementById('exercise-view');
const $exerciseContent = document.getElementById('exercise-content');
const $toggleBtn   = document.getElementById('view-toggle-btn');
const $exportBtn   = document.getElementById('export-btn');
const $title       = document.querySelector('.article-title');
const $meta        = document.querySelector('.article-meta');

// ============================================================
// INIT
// ============================================================
function init() {
  document.title = '阅读: ' + ARTICLE_DATA.title;
  $title.textContent = ARTICLE_DATA.title;
  const metaParts = [ARTICLE_DATA.author, ARTICLE_DATA.source].filter(Boolean);
  if (metaParts.length) $meta.textContent = metaParts.join(' \u00b7 ');
  loadWordBank();
  renderArticleWithHighlights();
  renderWordBank();
  bindEvents();
}

function renderArticleWithHighlights() {
  var html = ARTICLE_DATA.content;
  if (!wordBank.length) {
    $article.innerHTML = html;
    return;
  }
  var words = wordBank.slice().sort(function(a, b) { return b.text.length - a.text.length; });
  words.forEach(function(w) {
    var escaped = w.text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var regex = new RegExp('\\b(' + escaped + ')\\b', 'gi');
    html = html.replace(regex, '<span class="word-highlight" data-word="' + w.text.toLowerCase() + '">$1</span>');
  });
  $article.innerHTML = html;
}

// ============================================================
// EVENTS
// ============================================================
function bindEvents() {
  // Selection → translate
  document.addEventListener('mouseup', handleSelection);

  // Click on highlighted word → show tooltip
  $article.addEventListener('click', function(e) {
    var span = e.target.closest('.word-highlight');
    if (!span) return;
    var wordText = span.dataset.word;
    var entry = wordBank.find(function(w) { return w.text.toLowerCase() === wordText; });
    if (entry) {
      showTooltip(e, entry.text, entry.translation, true);
    }
  });

  // Hide tooltip on outside click
  document.addEventListener('mousedown', e => {
    if (!$tooltip.contains(e.target)) $tooltip.style.display = 'none';
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  // View toggle
  $toggleBtn.addEventListener('click', toggleView);

  // Export
  $exportBtn.addEventListener('click', exportWordBank);
}

// ============================================================
// SELECTION & TRANSLATION
// ============================================================
function handleSelection(e) {
  if (e.target.closest('.exercise-view, .word-bank-panel, .tooltip, .top-bar')) return;

  const sel = window.getSelection();
  const text = sel.toString().trim();
  if (!text) return;

  const dictResult = dictLookup(text);
  const ctx = getSelectionContext(sel);

  if (dictResult) {
    showTooltip(e, text, dictResult, true);
    addToWordBank(text, dictResult, ctx);
  } else {
    showTooltip(e, text, '\u2026\u7ffb\u8bd1\u4e2d', false);
    translateAPI(text).then(trans => {
      showTooltip(e, text, trans, true);
      addToWordBank(text, trans, ctx);
    }).catch(() => {
      showTooltip(e, text, '\u26a0 \u7f51\u7edc\u8fde\u63a5\u4e0d\u53ef\u7528', false);
      addToWordBank(text, '（待翻译）', ctx);
    });
  }
}

function dictLookup(text) {
  const lower = text.toLowerCase().trim();
  const dict = ARTICLE_DATA.dictionary;
  // Direct
  if (dict[text]) return dict[text];
  if (dict[lower]) return dict[lower];
  // Strip punctuation
  const clean = lower.replace(/[.,!?;:'"()\[\]{}]/g, '');
  if (dict[clean]) return dict[clean];
  // Simple stemming
  const stems = [
    clean.replace(/s$/, ''), clean.replace(/es$/, ''),
    clean.replace(/ed$/, ''), clean.replace(/ing$/, ''),
    clean.replace(/ly$/, ''),  clean.replace(/er$/, ''),
    clean.replace(/est$/, ''),  clean.replace(/tion$/, 'tion').replace(/tions$/, 'tion'),
  ];
  for (const s of stems) { if (dict[s]) return dict[s]; }
  // Reverse: try adding common suffixes
  for (const suf of ['s','ed','ing','ly','er','est']) { if (dict[clean+suf]) return dict[clean+suf]; }
  return null;
}

var TRANSLATE_TIMEOUT = 5000;
function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function() { reject(new Error('timeout')); }, ms);
    fetch(url).then(function(r) { clearTimeout(timer); resolve(r); }, function(e) { clearTimeout(timer); reject(e); });
  });
}

async function translateAPI(text) {
  // Primary: MyMemory (faster in China, no key needed)
  try {
    var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|zh-CN';
    var r = await fetchWithTimeout(url, TRANSLATE_TIMEOUT);
    if (!r.ok) throw new Error('MM fail');
    var d = await r.json();
    return d.responseData.translatedText;
  } catch (_) {
    // Fallback: Google Translate (unofficial, faster outside China / more accurate)
    try {
      var url2 = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + encodeURIComponent(text);
      var r2 = await fetchWithTimeout(url2, TRANSLATE_TIMEOUT);
      if (!r2.ok) throw new Error('GT fail');
      var d2 = await r2.json();
      return d2[0].map(function(x) { return x[0]; }).join('');
    } catch (_2) {
      throw new Error('all translate failed');
    }
  }
}

function getSelectionContext(sel) {
  if (!sel.rangeCount) return '';
  try {
    const range = sel.getRangeAt(0);
    const container = range.commonAncestorContainer;
    var fullText = container.nodeType === 3
      ? container.parentElement.textContent
      : (container.textContent || range.toString());
    var selectedText = sel.toString().trim();
    if (!selectedText || !fullText) return selectedText.substring(0, 300);

    // Find the sentence containing the selected text
    var pos = fullText.toLowerCase().indexOf(selectedText.toLowerCase());
    if (pos === -1) return selectedText.substring(0, 300);

    // Walk backwards to find sentence start
    var start = pos;
    for (var i = pos - 1; i >= 0; i--) {
      if (fullText[i] === '.' || fullText[i] === '!' || fullText[i] === '?') {
        start = i + 1;
        break;
      }
      start = i;
    }
    // Walk forwards to find sentence end
    var end = pos + selectedText.length;
    for (var j = end; j < fullText.length; j++) {
      if (fullText[j] === '.' || fullText[j] === '!' || fullText[j] === '?') {
        end = j + 1;
        break;
      }
    }
    return fullText.substring(start, end).trim().substring(0, 300);
  } catch { return ''; }
}

function showTooltip(e, original, translation, added) {
  $tooltip.innerHTML =
    '<div class="tooltip-original">' + esc(original) + '</div>' +
    '<div class="tooltip-translation">' + esc(translation) + '</div>' +
    (added ? '<div class="tooltip-hint">\u2713 \u5df2\u6dfb\u52a0\u5230\u5355\u8bcd\u672c</div>' : '');
  $tooltip.style.display = 'block';
  // Position: measure first at (0,0), then move
  $tooltip.style.left = '0px'; $tooltip.style.top = '0px';
  requestAnimationFrame(() => {
    const r = $tooltip.getBoundingClientRect();
    let x = e.clientX + 12, y = e.clientY - r.height - 12;
    if (x + r.width > window.innerWidth - 10) x = window.innerWidth - r.width - 10;
    if (y < 10) y = e.clientY + 24;
    if (x < 10) x = 10;
    $tooltip.style.left = x + 'px';
    $tooltip.style.top = y + 'px';
  });
}

// ============================================================
function loadWordBank() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) wordBank = JSON.parse(s); } catch { wordBank = []; }
}

function saveWordBank() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(wordBank)); } catch(e) { console.error(e); }
}

function addToWordBank(text, translation, context) {
  const exist = wordBank.find(w => w.text.toLowerCase() === text.toLowerCase());
  if (exist) {
    // Update translation if previously empty
    if (exist.translation === '（待翻译）' && translation !== '（待翻译）') {
      exist.translation = translation;
      saveWordBank(); renderWordBank();
    }
    return;
  }
  wordBank.push({ text, translation, context: (context||'').substring(0,200), ts: Date.now() });
  saveWordBank(); renderWordBank(); renderArticleWithHighlights();
}

function renderWordBank() {
  $wordCount.textContent = wordBank.length;
  if (!wordBank.length) {
    $wordList.innerHTML = '<p class="empty-hint">\u7528\u9f20\u6807\u5212\u51fa\u4e0d\u61c2\u7684\u5355\u8bcd\u6216\u53e5\u5b50<br>\u7ffb\u8bd1\u4f1a\u81ea\u52a8\u51fa\u73b0\u5728\u8fd9\u91cc</p>';
    return;
  }
  $wordList.innerHTML = wordBank.map((w, i) =>
    '<div class="word-card">' +
      '<div class="word-text">' + esc(w.text) + '</div>' +
      '<div class="word-translation">' + esc(w.translation) + '</div>' +
      (w.context ? '<div class="word-context">' + esc(w.context) + '</div>' : '') +
      '<button class="word-remove" data-idx="' + i + '" title="\u5220\u9664">\u00d7</button>' +
    '</div>'
  ).join('');

  $wordList.querySelectorAll('.word-remove').forEach(b => {
    b.addEventListener('click', e => {
      wordBank.splice(parseInt(e.currentTarget.dataset.idx), 1);
      saveWordBank(); renderWordBank(); renderArticleWithHighlights();
    });
  });
}

function exportWordBank() {
  if (!wordBank.length) { alert('\u5355\u8bcd\u672c\u4e3a\u7a7a'); return; }
  const lines = wordBank.map(w => w.text + '\t' + w.translation + '\t' + (w.context||''));
  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wordbank-' + ARTICLE_DATA.id + '.txt';
  a.click(); URL.revokeObjectURL(a.href);
}

// ============================================================
// EXERCISE 1: WORD DEFINITIONS (from word bank)
// ============================================================
function renderWordExercise() {
  var words = wordBank.filter(function(w){
    return w.translation && w.translation !== '\uff08\u5f85\u7ffb\u8bd1\uff09' && w.text.split(/\s+/).length <= 3;
  });
  if (!words.length) {
    $exerciseContent.innerHTML =
      '<div class="exercise-empty">' +
        '<p>\u5355\u8bcd\u672c\u4e3a\u7a7a\u6216\u65e0\u7ffb\u8bd1</p>' +
        '<p class="sub">\u8fd4\u56de\u9605\u8bfb\u89c6\u89c9\u4e2d\u5212\u51fa\u4e0d\u61c2\u7684\u5355\u8bcd\uff0c\u7ffb\u8bd1\u4f1a\u81ea\u52a8\u6dfb\u52a0\u5230\u5355\u8bcd\u672c</p>' +
      '</div>';
    return;
  }

  var dictValues = Object.values(ARTICLE_DATA.dictionary);
  var dictKeys = Object.keys(ARTICLE_DATA.dictionary);
  var articleText = $article.textContent || '';

  // Find a sentence from the article containing this word
  function findContext(word) {
    var lower = word.toLowerCase();
    // Split into sentences, but skip periods that are part of abbreviations or decimals
    // e.g. "U.S.", "Mr.", "$9bn.", "1.5" should not break sentences
    var sentences = articleText
      .replace(/([A-Z])\./g, '$1\x00')   // protect "U." type abbreviations
      .replace(/(\d)\.(\d)/g, '$1\x01$2') // protect decimals like "1.5"
      .match(/[^.!?]+[.!?]+/g) || [];
    for (var i = 0; i < sentences.length; i++) {
      var s = sentences[i].replace(/\x00/g, '.').replace(/\x01/g, '.');
      // Try exact word match first
      if (new RegExp('\\b' + lower.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i').test(s)) {
        return s.trim();
      }
    }
    // Fallback: try stem matching (e.g. "divest" matches "divesting", "divested")
    var stem = lower.replace(/(ing|ed|er|ers|es|s)$/, '');
    if (stem.length >= 4) {
      for (var j = 0; j < sentences.length; j++) {
        var s2 = sentences[j].replace(/\x00/g, '.').replace(/\x01/g, '.');
        if (s2.toLowerCase().indexOf(stem) !== -1) return s2.trim();
      }
    }
    return '';
  }

  // Highlight the target word inside escaped context HTML
  function highlightWord(context, word) {
    if (!context) return '';
    var escapedCtx = esc(context);
    var pattern = esc(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escapedCtx.replace(new RegExp('\\b(' + pattern + ')\\b', 'gi'), '<span class="ctx-highlight">$1</span>');
  }

  // Replace target word with a blank in escaped context HTML
  function blankWord(context, word) {
    if (!context) return '';
    var escapedCtx = esc(context);
    var pattern = esc(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escapedCtx.replace(new RegExp('\\b' + pattern + '\\b', 'gi'), '<span class="word-blank">_____</span>');
  }

  function shuffleArr(arr) { return arr.slice().sort(function(){return Math.random() - 0.5;}); }

  // Generate distractors: prefer similar-length items, fall back to full pool
  function genDistractors(correct, pool, n) {
    var filtered = pool.filter(function(v){ return v !== correct && v.length >= correct.length*0.5 && v.length <= correct.length*1.8; });
    if (filtered.length < n) filtered = pool.filter(function(v){ return v !== correct; });
    return shuffleArr(filtered).slice(0, n);
  }

  // Question type rotation: en2cn, en2cn, cn2en, cloze
  var typePattern = ['en2cn', 'en2cn', 'cn2en', 'cloze'];
  var allTranslations = words.map(function(w){return w.translation;});
  var allWords = words.map(function(w){return w.text;});

  var questions = words.map(function(item, i) {
    var ctx = (item.context && item.context.length > 10) ? item.context : findContext(item.text);
    var qType = typePattern[i % typePattern.length];
    var correct, opts;

    if (qType === 'en2cn') {
      correct = item.translation;
      opts = shuffleArr(genDistractors(correct, allTranslations.concat(dictValues), 3).concat([correct]));
    } else if (qType === 'cn2en') {
      correct = item.text;
      opts = shuffleArr(genDistractors(correct, allWords.concat(dictKeys), 3).concat([correct]));
    } else {
      correct = item.text;
      opts = shuffleArr(genDistractors(correct, allWords.concat(dictKeys), 3).concat([correct]));
    }
    if (ctx && ctx.toLowerCase().indexOf(item.text.toLowerCase()) === -1) ctx = '';
    return { qType: qType, ctx: ctx, word: item.text, meaning: item.translation, correct: correct, opts: opts };
  });

  // Build HTML
  var typeLabels = { en2cn: '\u82f1\u2192\u4e2d', cn2en: '\u4e2d\u2192\u82f1', cloze: '\u9009\u8bcd\u586b\u7a7a' };

  $exerciseContent.innerHTML =
    '<div class="exercise-header"><h2>\u5355\u8bcd\u91ca\u4e49</h2>' +
    '<p>\u6839\u636e\u8bed\u5883\u9009\u62e9\u6b63\u786e\u7b54\u6848\uff08\u82f1\u2192\u4e2d\u3001\u4e2d\u2192\u82f1\u3001\u9009\u8bcd\u586b\u7a7a\u4ea4\u53c9\u51fa\u73b0\uff09</p></div>' +
    '<div class="word-exercise-list">' +
      questions.map(function(q, i) {
        var prompt = '';
        if (q.qType === 'en2cn') {
          prompt = '<div class="question-word">' + esc(q.word) + '</div>' +
            (q.ctx ? '<div class="question-context">' + highlightWord(q.ctx, q.word) + '</div>' : '');
        } else if (q.qType === 'cn2en') {
          prompt = '<div class="question-meaning">\u91ca\u4e49\uff1a' + esc(q.meaning) + '</div>' +
            (q.ctx ? '<div class="question-context">' + highlightWord(q.ctx, q.word) + '</div>' : '');
        } else {
          prompt = '<div class="question-instruction">\u9009\u51fa\u586b\u5165\u7a7a\u767d\u5904\u7684\u8bcd</div>' +
            (q.ctx ? '<div class="question-context cloze-context">' + blankWord(q.ctx, q.word) + '</div>' : '<div class="question-word">' + esc(q.word) + '</div>');
        }
        return '<div class="word-question" data-idx="' + i + '">' +
          '<div class="question-num">' + (i+1) + '</div>' +
          '<div class="question-body">' +
            '<span class="qtype-badge">' + typeLabels[q.qType] + '</span>' +
            prompt +
            '<div class="question-options">' +
              q.opts.map(function(o){return '<button class="option-btn" data-ok="' + (o===q.correct) + '">' + esc(o) + '</button>';}).join('') +
            '</div>' +
            '<div class="question-feedback"></div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>' +
    '<div class="exercise-actions">' +
      '<button class="btn btn-primary" id="word-show-answers">\u663e\u793a\u6b63\u786e\u7b54\u6848</button>' +
    '</div>' +
    '<div class="summary-bar" id="word-summary"></div>';

  $exerciseContent.querySelectorAll('.option-btn').forEach(function(b) {
    b.addEventListener('click', onWordOption);
  });

  document.getElementById('word-show-answers').addEventListener('click', function() {
    $exerciseContent.querySelectorAll('.word-question').forEach(function(q) {
      q.querySelectorAll('.option-btn').forEach(function(b) {
        b.disabled = true;
        if (b.dataset.ok === 'true') {
          b.classList.add('correct');
          b.classList.remove('selected-wrong');
        } else {
          b.classList.remove('selected-correct', 'selected-wrong');
        }
      });
      var fb = q.querySelector('.question-feedback');
      if (fb && !fb.textContent) {
        fb.textContent = '\u2713 \u6b63\u786e\u7b54\u6848\u5df2\u663e\u793a';
        fb.className = 'question-feedback correct';
      }
    });
  });
}

function onWordOption(e) {
  const btn = e.currentTarget;
  const q = btn.closest('.word-question');
  const ok = btn.dataset.ok === 'true';
  const fb = q.querySelector('.question-feedback');

  // Disable all options in this question
  q.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.ok === 'true') b.classList.add('correct');
  });

  if (ok) {
    btn.classList.add('selected-correct');
    fb.textContent = '\u2713 \u6b63\u786e'; fb.className = 'question-feedback correct';
  } else {
    btn.classList.add('selected-wrong');
    fb.textContent = '\u2717 \u6b63\u786e\u7b54\u6848\u5df2\u7eff\u8272\u9ad8\u4eae'; fb.className = 'question-feedback wrong';
  }

  // Summary
  const allQ = $exerciseContent.querySelectorAll('.word-question');
  const done = $exerciseContent.querySelectorAll('.option-btn:disabled');
  const totalDone = new Set();
  done.forEach(b => totalDone.add(b.closest('.word-question').dataset.idx));
  if (totalDone.size === allQ.length) {
    const correctCount = $exerciseContent.querySelectorAll('.option-btn.selected-correct').length;
    const pct = Math.round(correctCount / allQ.length * 100);
    document.getElementById('word-summary').textContent =
      '\u5b8c\u6210\uff01\u6b63\u786e\u7387\uff1a' + correctCount + '/' + allQ.length + ' (' + pct + '%)';
  }
}

// ============================================================
// EXERCISE 2: SUMMARY CLOZE
// ============================================================
function renderClozeExercise() {
  const cloze = ARTICLE_DATA.exercises.summaryCloze;
  let html = cloze.text;

  // Replace {{id}} markers with interactive blanks
  cloze.blanks.forEach(b => {
    const marker = '{{' + b.id + '}}';
    html = html.replace(marker,
      '<span class="cloze-blank" data-id="'+b.id+'" data-correct="'+esc(b.answer)+'" data-filled="">______</span>');
  });

  // Build word bank (answers + distractors)
  const allWords = [...cloze.blanks.map(b=>b.answer), ...(cloze.distractors||[])];
  const shuffled = [...allWords].sort(()=>Math.random()-.5);

  $exerciseContent.innerHTML =
    '<div class="exercise-header"><h2>\u5168\u6587\u6458\u8981\u5b8c\u5f62</h2><p>\u4ece\u4e0b\u65b9\u8bcd\u5e93\u4e2d\u9009\u62e9\u5408\u9002\u7684\u8bcd\u586b\u5165\u7a7a\u767d\u5904\uff08\u6458\u8981\u4e3a\u82f1\u6587\uff09</p></div>' +
    '<div class="cloze-text">'+html+'</div>' +
    '<div class="cloze-bank" id="cloze-bank">' +
      shuffled.map(w => '<button class="cloze-word" data-word="'+esc(w)+'">'+esc(w)+'</button>').join('') +
    '</div>' +
    '<div class="exercise-actions">' +
      '<button class="btn btn-primary" id="cloze-check">\u68c0\u67e5\u7b54\u6848</button>' +
      '<button class="btn" id="cloze-reset">\u91cd\u7f6e</button>' +
      '<button class="btn" id="cloze-show-answers">\u663e\u793a\u6b63\u786e\u7b54\u6848</button>' +
    '</div>' +
    '<div class="exercise-feedback" id="cloze-feedback"></div>';

  selectedClozeWord = null;
  const bankEl = document.getElementById('cloze-bank');
  const blanks = $exerciseContent.querySelectorAll('.cloze-blank');

  // Click word in bank → select it
  bankEl.addEventListener('click', e => {
    const w = e.target.closest('.cloze-word');
    if (!w || w.classList.contains('used')) return;
    if (selectedClozeWord) selectedClozeWord.classList.remove('selected');
    selectedClozeWord = w;
    w.classList.add('selected');
  });

  // Click blank → fill with selected word
  blanks.forEach(blank => {
    blank.addEventListener('click', () => {
      if (!selectedClozeWord) return;
      // If blank already filled, return previous word
      const prev = blank.dataset.filled;
      if (prev) {
        bankEl.querySelectorAll('.cloze-word').forEach(w => {
          if (w.dataset.word === prev && w.classList.contains('used')) w.classList.remove('used');
        });
      }
      blank.textContent = selectedClozeWord.dataset.word;
      blank.dataset.filled = selectedClozeWord.dataset.word;
      blank.classList.add('filled');
      selectedClozeWord.classList.add('used');
      selectedClozeWord.classList.remove('selected');
      selectedClozeWord = null;
    });
  });

  // Check
  document.getElementById('cloze-check').addEventListener('click', () => {
    let ok = 0;
    blanks.forEach(b => {
      if (b.dataset.filled === b.dataset.correct) { b.classList.add('correct'); b.classList.remove('wrong'); ok++; }
      else { b.classList.add('wrong'); b.classList.remove('correct'); }
    });
    document.getElementById('cloze-feedback').innerHTML =
      '<div class="summary-bar">\u6b63\u786e\u7387\uff1a'+ok+'/'+blanks.length+'</div>';
  });

  // Reset
  document.getElementById('cloze-reset').addEventListener('click', () => {
    blanks.forEach(b => { b.textContent='______'; b.dataset.filled=''; b.classList.remove('filled','correct','wrong'); });
    bankEl.querySelectorAll('.cloze-word').forEach(w => w.classList.remove('used','selected'));
    document.getElementById('cloze-feedback').innerHTML = '';
    selectedClozeWord = null;
  });

  // Show correct answers
  document.getElementById('cloze-show-answers').addEventListener('click', () => {
    blanks.forEach(b => {
      b.textContent = b.dataset.correct;
      b.dataset.filled = b.dataset.correct;
      b.classList.add('filled', 'correct');
      b.classList.remove('wrong');
    });
    bankEl.querySelectorAll('.cloze-word').forEach(w => w.classList.add('used'));
    document.getElementById('cloze-feedback').innerHTML =
      '<div class="summary-bar">\u6b63\u786e\u7b54\u6848\u5df2\u663e\u793a</div>';
  });
}

function renderReorderExercise() {

  $exerciseContent.innerHTML =

        '<div class="reorder-list" id="rlist-'+idx+'">' +
          shuffled.map(s =>
            '<div class="reorder-item" draggable="true" data-correct="'+s.correctOrder+'">' +
              '<span class="drag-handle">\u2807</span>' +
              '<span class="reorder-text">'+esc(s.text)+'</span>' +
            '</div>'
          ).join('') +
        '</div>' +
        '<div class="exercise-actions">' +
          '<button class="btn btn-primary check-reorder" data-idx="'+idx+'">\u68c0\u67e5</button>' +
          '<button class="btn show-reorder-answers" data-idx="'+idx+'">\u663e\u793a\u6b63\u786e\u7b54\u6848</button>' +
        '</div>' +
        '<div class="exercise-feedback" id="rfb-'+idx+'"></div>' +
      '</div>';
    }).join('');

  // Setup DnD for each list
  exercises.forEach((_, idx) => setupDnD('rlist-'+idx));

  // Check buttons
  $exerciseContent.querySelectorAll('.check-reorder').forEach(b => {
    b.addEventListener('click', e => {
      const idx = e.currentTarget.dataset.idx;
      const items = document.querySelectorAll('#rlist-'+idx+' .reorder-item');
      let ok = 0;
      items.forEach((item, i) => {
        if (parseInt(item.dataset.correct) === i) { item.classList.add('correct'); item.classList.remove('wrong'); ok++; }
        else { item.classList.add('wrong'); item.classList.remove('correct'); }
      });
      document.getElementById('rfb-'+idx).innerHTML =
        '<div class="summary-bar">\u6b63\u786e\u7387\uff1a'+ok+'/'+items.length+'</div>';
    });
  });

  // Show correct answers buttons (reorder items into correct order)
  $exerciseContent.querySelectorAll('.show-reorder-answers').forEach(b => {
    b.addEventListener('click', e => {
      const idx = e.currentTarget.dataset.idx;
      const list = document.getElementById('rlist-'+idx);
      const items = [...list.querySelectorAll('.reorder-item')];
      // Sort by correctOrder
      items.sort((a, b) => parseInt(a.dataset.correct) - parseInt(b.dataset.correct));
      // Re-append in correct order
      items.forEach(item => {
        item.classList.add('correct');
        item.classList.remove('wrong');
        list.appendChild(item);
      });
      document.getElementById('rfb-'+idx).innerHTML =
        '<div class="summary-bar">\u6b63\u786e\u7b54\u6848\u5df2\u663e\u793a</div>';
    });
  });
}

function setupDnD(listId) {
  const list = document.getElementById(listId);
  let dragItem = null;

  list.querySelectorAll('.reorder-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragItem = item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      // Needed for Firefox
      e.dataTransfer.setData('text/plain', '');
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      dragItem = null;
      // Remove all placeholders
      list.querySelectorAll('.reorder-placeholder').forEach(p => p.remove());
    });
    item.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (!dragItem || dragItem === item) return;
      const rect = item.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid) list.insertBefore(dragItem, item);
      else list.insertBefore(dragItem, item.nextSibling);
    });
  });
}

// ============================================================
// EXERCISE 4: CONCEPT MAP
// ============================================================
function renderConceptMap() {
  const map = ARTICLE_DATA.exercises.conceptMap;
  const W = 800, H = map.height || 560;

  const blankNodes = map.nodes.filter(n => n.blank);
  const blankEdges = map.edges.filter(e => e.blank);
  const nodeAnswers = blankNodes.map(n => n.answer);
  const edgeAnswers = blankEdges.map(e => e.answer);
  const nodeDistractors = map.nodes.filter(n => !n.blank).map(n => n.label);
  const edgeDistractors = map.edges.filter(e => !e.blank).map(e => e.label);

  function shuf(a) { return [...a].sort(() => Math.random() - 0.5); }
  function buildOptions(correct, others, distractors) {
    let pool = others.filter(a => a !== correct);
    pool = pool.concat(shuf(distractors).slice(0, 3));
    pool = [...new Set(pool)].slice(0, 3);
    return shuf([...pool, correct]);
  }
  function maxLen(opts) { return opts.reduce((m, o) => Math.max(m, o.length), 0); }

  // ===== PASS 1: Calculate node dimensions =====
  const dims = {};
  map.nodes.forEach(node => {
    const nh = 36;
    let nw;
    if (node.blank) {
      const opts = buildOptions(node.answer, nodeAnswers, nodeDistractors);
      nw = Math.max(maxLen(opts) * 8 + 32, 96);
    } else {
      nw = Math.max(node.label.length * 9 + 24, 76);
    }
    dims[node.id] = { x: node.x, y: node.y, w: nw, h: nh, hw: nw / 2, hh: nh / 2 };
  });

  // ===== PASS 2: Force-directed layout (fix overlaps & bad coordinates) =====
  const nodes = map.nodes;
  const edges = map.edges;
  const REPULSION = 25000;
  const SPRING_LEN = 180;
  const SPRING_K = 0.03;
  const DAMPING = 0.85;
  const MAX_V = 10;
  const PADDING = 55;
  const ITERS = 600;

  const sim = {};
  nodes.forEach(n => { sim[n.id] = { x: dims[n.id].x, y: dims[n.id].y, vx: 0, vy: 0 }; });

  for (let iter = 0; iter < ITERS; iter++) {
    // Reset forces
    nodes.forEach(n => { sim[n.id].fx = 0; sim[n.id].fy = 0; });

    // Repulsive forces between ALL pairs
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = sim[nodes[i].id], b = sim[nodes[j].id];
        const da = dims[nodes[i].id], db = dims[nodes[j].id];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 0.5);
        // Node "radius" approximation for collision distance
        const minSep = Math.max(da.hw + db.hw, da.hh + db.hh) + 45;
        if (dist < minSep * 2.5) {
          const force = REPULSION / (dist * dist);
          const fx = (dx / dist) * force, fy = (dy / dist) * force;
          a.fx -= fx; a.fy -= fy;
          b.fx += fx; b.fy += fy;
        }
      }
    }

    // Attractive spring forces along edges
    edges.forEach(e => {
      if (!sim[e.from] || !sim[e.to]) return;
      const a = sim[e.from], b = sim[e.to];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 0.5);
      const diff = dist - SPRING_LEN;
      const force = SPRING_K * diff;
      const fx = (dx / dist) * force, fy = (dy / dist) * force;
      a.fx += fx; a.fy += fy;
      b.fx -= fx; b.fy -= fy;
    });

    // Gentle gravity toward canvas center (prevents nodes drifting to corners)
    nodes.forEach(n => {
      const p = sim[n.id];
      p.fx += (W / 2 - p.x) * 0.002;
      p.fy += (H / 2 - p.y) * 0.003;
    });

    // Update positions
    nodes.forEach(n => {
      const p = sim[n.id], d = dims[n.id];
      p.vx = (p.vx + p.fx) * DAMPING;
      p.vy = (p.vy + p.fy) * DAMPING;
      const v = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (v > MAX_V) { p.vx = p.vx / v * MAX_V; p.vy = p.vy / v * MAX_V; }
      p.x += p.vx;
      p.y += p.vy;
      // Clamp to canvas bounds
      p.x = Math.max(PADDING + d.hw, Math.min(W - PADDING - d.hw, p.x));
      p.y = Math.max(PADDING + d.hh, Math.min(H - PADDING - d.hh, p.y));
    });
  }

  // Write final positions back to dims
  nodes.forEach(n => { dims[n.id].x = sim[n.id].x; dims[n.id].y = sim[n.id].y; });

  // ===== Border intersection helper =====
  function borderPt(nodeDim, towardDim) {
    const dx = towardDim.x - nodeDim.x;
    const dy = towardDim.y - nodeDim.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.01) return { x: nodeDim.x, y: nodeDim.y };
    const ux = dx / dist, uy = dy / dist;
    const sx = Math.abs(ux) > 0.001 ? nodeDim.hw / Math.abs(ux) : 1e4;
    const sy = Math.abs(uy) > 0.001 ? nodeDim.hh / Math.abs(uy) : 1e4;
    const s = Math.min(sx, sy);
    return { x: nodeDim.x + ux * s, y: nodeDim.y + uy * s };
  }

  let svg = '';

  // ===== PASS 3: Draw edges (border-to-border) =====
  edges.forEach(edge => {
    const fd = dims[edge.from], td = dims[edge.to];
    if (!fd || !td) return;
    const start = borderPt(fd, td);
    const end = borderPt(td, fd);
    const dx = end.x - start.x, dy = end.y - start.y;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) return;
    const gap = 3;
    const ex = end.x - (dx / len) * gap;
    const ey = end.y - (dy / len) * gap;

    svg += '<line x1="' + start.x.toFixed(1) + '" y1="' + start.y.toFixed(1) +
           '" x2="' + ex.toFixed(1) + '" y2="' + ey.toFixed(1) +
           '" stroke="#cbd5e1" stroke-width="2" />';
    const angle = Math.atan2(dy, dx);
    const aLen = 8;
    const ax1 = ex - aLen * Math.cos(angle - 0.4), ay1 = ey - aLen * Math.sin(angle - 0.4);
    const ax2 = ex - aLen * Math.cos(angle + 0.4), ay2 = ey - aLen * Math.sin(angle + 0.4);
    svg += '<polygon points="' + ex.toFixed(1) + ',' + ey.toFixed(1) + ' ' +
           ax1.toFixed(1) + ',' + ay1.toFixed(1) + ' ' + ax2.toFixed(1) + ',' + ay2.toFixed(1) +
           '" fill="#cbd5e1"/>';

    const mx = (start.x + ex) / 2, my = (start.y + ey) / 2;
    if (edge.blank) {
      const opts = buildOptions(edge.answer, edgeAnswers, edgeDistractors);
      const selW = Math.max(maxLen(opts) * 7 + 28, 84);
      svg += '<foreignObject x="' + (mx - selW / 2).toFixed(1) + '" y="' + (my - 14).toFixed(1) +
             '" width="' + selW + '" height="28">' +
             '<select class="blank-select" data-answer="' + esc(edge.answer) + '">' +
             '<option value="">\u2753</option>' +
             opts.map(o => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') +
             '</select></foreignObject>';
    } else {
      const lw = Math.max(edge.label.length * 7 + 16, 50);
      svg += '<rect x="' + (mx - lw / 2).toFixed(1) + '" y="' + (my - 12).toFixed(1) +
             '" width="' + lw + '" height="24" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>' +
             '<text x="' + mx.toFixed(1) + '" y="' + (my + 4).toFixed(1) +
             '" text-anchor="middle" class="edge-label">' + esc(edge.label) + '</text>';
    }
  });

  // ===== PASS 4: Draw nodes (on top) =====
  nodes.forEach(node => {
    const d = dims[node.id];
    if (node.blank) {
      const opts = buildOptions(node.answer, nodeAnswers, nodeDistractors);
      svg += '<rect x="' + (d.x - d.hw).toFixed(1) + '" y="' + (d.y - d.hh).toFixed(1) +
             '" width="' + d.w + '" height="' + d.h +
             '" rx="8" fill="#fef3c7" stroke="#f08c00" stroke-width="2"/>' +
             '<foreignObject x="' + (d.x - d.hw + 6).toFixed(1) + '" y="' + (d.y - 14).toFixed(1) +
             '" width="' + (d.w - 12) + '" height="28">' +
             '<select class="blank-select" data-answer="' + esc(node.answer) + '">' +
             '<option value="">\u2753</option>' +
             opts.map(o => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') +
             '</select></foreignObject>';
    } else {
      svg += '<rect x="' + (d.x - d.hw).toFixed(1) + '" y="' + (d.y - d.hh).toFixed(1) +
             '" width="' + d.w + '" height="' + d.h +
             '" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>' +
             '<text x="' + d.x.toFixed(1) + '" y="' + (d.y + 5).toFixed(1) +
             '" text-anchor="middle" class="node-label">' + esc(node.label) + '</text>';
    }
  });

  $exerciseContent.innerHTML =
    '<div class="exercise-header"><h2>\u6982\u5ff5\u5173\u7cfb\u56fe</h2><p>\u4ece\u4e0b\u62c9\u83dc\u5355\u4e2d\u9009\u62e9\u6b63\u786e\u7684\u6982\u5ff5\u6216\u5173\u7cfb</p></div>' +
    '<div class="concept-map-container">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" class="concept-map-svg">' + svg + '</svg>' +
    '</div>' +
    '<div class="exercise-actions">' +
      '<button class="btn btn-primary" id="concept-check">\u68c0\u67e5\u7b54\u6848</button>' +
      '<button class="btn" id="concept-show-answers">\u663e\u793a\u6b63\u786e\u7b54\u6848</button>' +
    '</div>' +
    '<div class="exercise-feedback" id="concept-feedback"></div>';

  function buildSummary() {
    var rels = map.edges.map(function(edge) {
      var from = map.nodes.find(function(n) { return n.id === edge.from; });
      var to = map.nodes.find(function(n) { return n.id === edge.to; });
      var fromLabel = from ? (from.blank ? from.answer : from.label) : '?';
      var toLabel = to ? (to.blank ? to.answer : to.label) : '?';
      var edgeLabel = edge.blank ? edge.answer : edge.label;
      return '<div class="rel-item">' +
        '<span>' + esc(fromLabel) + '</span>' +
        '<span class="rel-arrow">\u2014[' + esc(edgeLabel) + ']\u2192</span>' +
        '<span>' + esc(toLabel) + '</span>' +
      '</div>';
    }).join('');
    return '<div class="concept-explanation"><h3>\u5173\u7cfb\u603b\u7ed3</h3>' + rels + '</div>';
  }

  document.getElementById('concept-check').addEventListener('click', function() {
    var selects = $exerciseContent.querySelectorAll('.blank-select');
    var ok = 0;
    selects.forEach(function(sel) {
      var ans = sel.dataset.answer.toLowerCase().trim();
      var val = sel.value.toLowerCase().trim();
      if (val && val === ans) { sel.classList.add('select-correct'); sel.classList.remove('select-wrong'); ok++; }
      else if (val) { sel.classList.add('select-wrong'); sel.classList.remove('select-correct'); }
    });
    var html = '<div class="summary-bar">\u6b63\u786e\u7387\uff1a' + ok + '/' + selects.length + '</div>';
    html += buildSummary();
    document.getElementById('concept-feedback').innerHTML = html;
  });

  document.getElementById('concept-show-answers').addEventListener('click', function() {
    var selects = $exerciseContent.querySelectorAll('.blank-select');
    selects.forEach(function(sel) {
      sel.value = sel.dataset.answer;
      sel.classList.add('select-correct');
      sel.classList.remove('select-wrong');
    });
    var html = '<div class="summary-bar">\u6b63\u786e\u7b54\u6848\u5df2\u663e\u793a</div>';
    html += buildSummary();
    document.getElementById('concept-feedback').innerHTML = html;
  });
}

// EXERCISE 5: SENTENCE PATTERNS

function renderPatternExercise() {
  const patterns = ARTICLE_DATA.exercises.sentencePatterns;
  if (!patterns || !patterns.length) {
    $exerciseContent.innerHTML =
      '<div class="exercise-empty">' +
        '<p>\u672c\u7bc7\u65e0\u53e5\u578b\u7ec3\u4e60</p>' +
      '</div>';
    return;
  }

  let html = '<div class="exercise-header"><h2>\u53e5\u578b\u7ec3\u4e60</h2>' +
    '<p>\u7406\u89e3\u6587\u7ae0\u4e2d\u7684\u6838\u5fc3\u53e5\u578b\u7ed3\u6784\uff0c\u5b8c\u6210\u6539\u5199\u7ec3\u4e60</p></div>';

  var qCounter = 0;
  patterns.forEach(function(p, idx) {
    html += '<div class="pattern-card">' +
      '<div class="pattern-name">' + esc(p.name) + '</div>' +
      '<div class="pattern-formula">' + esc(p.formula) + '</div>' +
      '<div class="pattern-explanation">' + esc(p.explanation) + '</div>' +
      '<div class="pattern-source">' + esc(p.source) + '</div>' +
    '</div>';

    // Support both: new format (questions) and old format (cloze)
    var questions = p.questions || [];
    if (p.cloze) {
      var clozeHtml = p.cloze.text;
      p.cloze.blanks.forEach(function(b) {
        clozeHtml = clozeHtml.replace('{{' + b.id + '}}', '______');
      });
      var answers = p.cloze.blanks.map(function(b){return b.answer;});
      var distractors = [...new Set(p.cloze.distractors || p.cloze.options || [])];
      questions.push({
        id: 'c' + idx,
        input: clozeHtml,
        isCloze: true,
        blanks: p.cloze.blanks,
        bankWords: answers.concat(distractors).sort(function(){return Math.random() - 0.5;})
      });
    }

    if (!questions.length) return;

    questions.forEach(function(q, qi) {
      var qid = 'pat-q-' + qCounter;
      html += '<div class="pattern-cloze" id="' + qid + '">';

      if (q.isCloze) {
        var clozeText = q.input;
        q.blanks.forEach(function(b) {
          clozeText = clozeText.replace('______',
            '<span class="cloze-blank" data-correct="' + esc(b.answer) + '" data-filled="">______</span>');
        });
        html += '<div class="cloze-text">' + clozeText + '</div>' +
          '<div class="cloze-bank">' +
            q.bankWords.map(function(w){return '<button class="cloze-word" data-word="' + esc(w) + '">' + esc(w) + '</button>';}).join('') +
          '</div>';
      } else {
        html += '<div class="question-instruction" style="margin-bottom:10px;font-size:14px;color:#5a6577">\u8bf7\u7528\u4ee5\u4e0a\u53e5\u578b\u6539\u5199\u4ee5\u4e0b\u53e5\u5b50\uff0c\u9009\u51fa\u6b63\u786e\u7684\u6539\u5199\u7248\u672c\uff1a</div>' +
          '<div class="cloze-text" style="margin-bottom:16px;padding:12px 16px;background:#fef3c7;border-radius:8px;border:1px solid #fde68a">' + esc(q.input) + '</div>';
        html += '<div class="question-options pat-opts" style="display:flex;flex-direction:column;gap:8px">';
        q.options.forEach(function(o, oi) {
          var isCorrect = (oi === q.answer);
          html += '<button class="option-btn pat-opt" style="text-align:left;padding:10px 14px;font-size:14px;font-family:Georgia,serif;line-height:1.4" data-correct="' + isCorrect + '">' +
            String.fromCharCode(65 + oi) + '. ' + esc(o) + '</button>';
        });
        html += '</div>';
      }

      html += '<div class="question-feedback" id="' + qid + '-fb"></div>' +
      '</div>';
      qCounter++;
    });
  });

  // Single pair of buttons at the bottom of the entire exercise
  html += '<div class="exercise-actions" style="margin-top:8px">' +
    '<button class="btn pattern-check-all">\u68c0\u67e5</button> ' +
    '<button class="btn pattern-show-all">\u663e\u793a\u7b54\u6848</button>' +
    '</div>' +
    '<div class="summary-bar pat-global-summary" style="display:none"></div>';

  $exerciseContent.innerHTML = html;

  // --- Cloze word bank interactions ---
  var clozeBanks = $exerciseContent.querySelectorAll('.cloze-bank');
  clozeBanks.forEach(function(bank) {
    var qContainer = bank.closest('.pattern-cloze');
    var blanks = qContainer.querySelectorAll('.cloze-blank');
    var selected = null;

    bank.addEventListener('click', function(e) {
      var w = e.target.closest('.cloze-word');
      if (!w || w.classList.contains('used')) return;
      if (selected) selected.classList.remove('selected');
      selected = w;
      w.classList.add('selected');
    });

    blanks.forEach(function(blank) {
      blank.addEventListener('click', function() {
        if (!selected) return;
        var prev = blank.dataset.filled;
        if (prev) {
          bank.querySelectorAll('.cloze-word').forEach(function(w) {
            if (w.dataset.word === prev && w.classList.contains('used')) w.classList.remove('used');
          });
        }
        blank.textContent = selected.dataset.word;
        blank.dataset.filled = selected.dataset.word;
        blank.classList.add('filled');
        selected.classList.add('used');
        selected.classList.remove('selected');
        selected = null;
      });
    });
  });

  // --- Multiple-choice: click to select (no auto-check) ---
  $exerciseContent.querySelectorAll('.pat-opt').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var qContainer = this.closest('.pattern-cloze');
      // Deselect siblings
      qContainer.querySelectorAll('.pat-opt').forEach(function(o) {
        o.classList.remove('pat-selected');
      });
      this.classList.add('pat-selected');
    });
  });

  // --- 检查 button: check all answered questions ---
  var checkBtn = $exerciseContent.querySelector('.pattern-check-all');
  if (checkBtn) {
    checkBtn.addEventListener('click', function() {
      var qContainers = $exerciseContent.querySelectorAll('.pattern-cloze');
      var correctCount = 0, answeredCount = 0;

      qContainers.forEach(function(qc) {
        var fb = qc.querySelector('.question-feedback');
        var opts = qc.querySelectorAll('.pat-opt');
        var blanks = qc.querySelectorAll('.cloze-blank');

        if (opts.length) {
          // Multiple-choice question
          var selected = qc.querySelector('.pat-opt.pat-selected');
          if (!selected) return;
          answeredCount++;
          var correct = selected.dataset.correct === 'true';
          // Mark all: correct answer green, selected-wrong red
          opts.forEach(function(o) {
            if (o.dataset.correct === 'true') o.classList.add('correct');
          });
          if (correct) {
            selected.classList.add('selected-correct');
            fb.textContent = '\u2713 \u6b63\u786e';
            fb.className = 'question-feedback correct';
            correctCount++;
          } else {
            selected.classList.add('selected-wrong');
            fb.textContent = '\u2717 \u4e0d\u6b63\u786e\uff0c\u6b63\u786e\u7b54\u6848\u5df2\u7eff\u8272\u9ad8\u4eae';
            fb.className = 'question-feedback wrong';
          }
        } else if (blanks.length) {
          // Cloze question
          var allFilled = true;
          blanks.forEach(function(b) { if (!b.dataset.filled) allFilled = false; });
          if (!allFilled) return;
          answeredCount++;
          var allRight = true;
          blanks.forEach(function(b) {
            if (b.dataset.filled === b.dataset.correct) {
              b.classList.add('correct');
            } else {
              b.classList.add('wrong');
              allRight = false;
            }
          });
          if (allRight) {
            fb.textContent = '\u2713 \u6b63\u786e';
            fb.className = 'question-feedback correct';
            correctCount++;
          } else {
            fb.textContent = '\u2717 \u6709\u9519\uff0c\u6b63\u786e\u7b54\u6848\u5df2\u7eff\u8272\u9ad8\u4eae';
            fb.className = 'question-feedback wrong';
          }
        }
      });

      var summary = $exerciseContent.querySelector('.pat-global-summary');
      summary.style.display = 'block';
      if (answeredCount === 0) {
        summary.textContent = '\u8bf7\u5148\u9009\u62e9\u7b54\u6848\u540e\u518d\u70b9\u51fb\u201c\u68c0\u67e5\u201d';
        summary.className = 'summary-bar neutral';
      } else {
        summary.textContent = '\u5171 ' + answeredCount + ' \u9898\uff0c\u6b63\u786e ' + correctCount + ' \u9898';
        summary.className = 'summary-bar ' + (correctCount === answeredCount ? 'all-correct' : '');
      }
    });
  }

  // --- 显示答案 button: reveal all correct answers ---
  var showBtn = $exerciseContent.querySelector('.pattern-show-all');
  if (showBtn) {
    showBtn.addEventListener('click', function() {
      // Reveal cloze blanks
      $exerciseContent.querySelectorAll('.cloze-blank').forEach(function(b) {
        b.textContent = b.dataset.correct;
        b.dataset.filled = b.dataset.correct;
        b.classList.add('filled', 'correct');
        b.classList.remove('wrong');
      });
      $exerciseContent.querySelectorAll('.cloze-word').forEach(function(w) { w.classList.add('used'); });

      // Reveal multiple-choice answers
      $exerciseContent.querySelectorAll('.pat-opt').forEach(function(o) {
        if (o.dataset.correct === 'true') o.classList.add('correct', 'selected-correct');
      });
      $exerciseContent.querySelectorAll('.pattern-cloze').forEach(function(qc) {
        var fb = qc.querySelector('.question-feedback');
        if (fb && !fb.textContent.trim()) {
          fb.textContent = '\u2713 \u6b63\u786e\u7b54\u6848\u5df2\u663e\u793a';
          fb.className = 'question-feedback correct';
        }
      });

      var summary = $exerciseContent.querySelector('.pat-global-summary');
      summary.style.display = 'block';
      summary.textContent = '\u6b63\u786e\u7b54\u6848\u5df2\u5168\u90e8\u663e\u793a';
      summary.className = 'summary-bar neutral';
    });
  }
}
// ============================================================
// EXERCISE 6: RECITATION
// ============================================================
var synth = window.speechSynthesis;
var currentUtterance = null;

function renderRecitation() {
  var aiPassages = ARTICLE_DATA.exercises.recitation && ARTICLE_DATA.exercises.recitation.passages || [];
  var customKey = 'recite_custom_' + ARTICLE_DATA.id;
  var customPassages = [];
  try { var c = localStorage.getItem(customKey); if (c) customPassages = JSON.parse(c); } catch(e) {}

  var allPassages = aiPassages.concat(customPassages);

  // Always show header + custom input area
  var html = '<div class="exercise-header"><h2>\u80cc\u8bf5</h2>' +
    '<p>\u80cc\u8bf5\u7247\u6bb5\uff0c\u53ef\u64ad\u653e\u3001\u9690\u85cf\u539f\u6587\u81ea\u6d4b</p></div>';

  // Custom passage input
  html += '<div class="recite-card" style="background:#fefce8;border-color:#fde68a">' +
    '<div class="recite-title">\u81ea\u5b9a\u4e49\u80cc\u8bf5\u7247\u6bb5</div>' +
    '<div class="recite-hint">\u7c98\u8d34\u6216\u8f93\u5165\u4f60\u60f3\u80cc\u8bf5\u7684\u6587\u5b57\uff0c\u70b9\u51fb\u201c\u6dfb\u52a0\u201d\u4fdd\u5b58</div>' +
    '<textarea id="custom-text" style="width:100%;min-height:80px;padding:10px;border:1px solid #e5e7eb;border-radius:6px;font-size:14px;font-family:Georgia,serif;line-height:1.6;resize:vertical" placeholder="\u7c98\u8d34\u4f60\u8981\u80cc\u8bf5\u7684\u82f1\u6587\u7247\u6bb5..."></textarea>' +
    '<div style="margin-top:8px;display:flex;gap:8px">' +
      '<button class="recite-btn primary" id="custom-add">\u6dfb\u52a0</button>' +
      '<span style="font-size:12px;color:#8b95a5;align-self:center">\u5df2\u4fdd\u5b58 ' + customPassages.length + ' \u4e2a\u81ea\u5b9a\u4e49\u7247\u6bb5</span>' +
    '</div>' +
  '</div>';

  if (!allPassages.length) {
    html += '<div class="exercise-empty"><p>\u6682\u65e0\u80cc\u8bf5\u6750\u6599\uff0c\u8bf7\u5728\u4e0a\u65b9\u7c98\u8d34\u6587\u5b57</p></div>';
    $exerciseContent.innerHTML = html;
    bindCustomAdd();
    return;
  }

  // Render all passages
  allPassages.forEach(function(p, i) {
    var isCustom = i >= aiPassages.length;
    html += '<div class="recite-card" data-idx="' + i + '">' +
      '<div class="recite-title">' + esc(p.title || '\u7247\u6bb5 ' + (i+1)) +
      (isCustom ? ' <span style="font-size:11px;color:#f08c00;font-weight:400">(\u81ea\u5b9a\u4e49)</span>' : '') +
      '</div>' +
      '<div class="recite-hint">\u70b9\u51fb\u201c\u9690\u85cf\u539f\u6587\u201d\u81ea\u6d4b\uff0c\u70b9\u51fb\u201c\u64ad\u653e\u201d\u542c\u53d1\u97f3</div>' +
      '<div class="recite-text" id="rt-' + i + '">' + esc(p.text) + '</div>' +
      '<div class="recite-actions">' +
        '<button class="recite-btn recite-speak" data-idx="' + i + '">\u25b6 \u64ad\u653e</button>' +
        '<button class="recite-btn recite-toggle" data-idx="' + i + '">\u9690\u85cf\u539f\u6587</button>' +
        '<button class="recite-btn recite-export" data-idx="' + i + '">\u2b07 \u6587\u672c</button>' +
        (isCustom ? '<button class="recite-btn recite-delete" data-idx="' + i + '" style="color:#e03131;border-color:#fcc">\u2715 \u5220\u9664</button>' : '') +
      '</div>' +
      '<div class="recite-status" id="rs-' + i + '"></div>' +
    '</div>';
  });

  $exerciseContent.innerHTML = html;
  if (synth && synth.speaking) { synth.cancel(); currentUtterance = null; }
  bindCustomAdd();
  bindSpeak();
  bindToggle();
  bindExport();
  bindDelete();
}

function bindCustomAdd() {
  var btn = document.getElementById('custom-add');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var textarea = document.getElementById('custom-text');
    var text = textarea.value.trim();
    if (!text) return;
    var customKey = 'recite_custom_' + ARTICLE_DATA.id;
    var customPassages = [];
    try { var c = localStorage.getItem(customKey); if (c) customPassages = JSON.parse(c); } catch(e) {}
    customPassages.push({ id: 'c' + Date.now(), title: '\u81ea\u5b9a\u4e49\u7247\u6bb5 ' + (customPassages.length + 1), text: text });
    localStorage.setItem(customKey, JSON.stringify(customPassages));
    textarea.value = '';
    renderRecitation();
  });
}

function bindSpeak() {
  $exerciseContent.querySelectorAll('.recite-speak').forEach(function(b) {
    b.addEventListener('click', function() {
      var idx = parseInt(this.dataset.idx);
      var text = document.getElementById('rt-' + idx).textContent;
      var status = document.getElementById('rs-' + idx);

      if (synth && synth.speaking && currentUtterance) {
        synth.cancel();
        currentUtterance = null;
        this.innerHTML = '\u25b6 \u64ad\u653e';
        this.classList.remove('speaking');
        status.textContent = '';
        return;
      }

      if (!synth) { status.textContent = '\u26a0 \u6d4f\u89c8\u5668\u4e0d\u652f\u6301\u8bed\u97f3\u5408\u6210'; return; }

      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      utterance.pitch = 1;

      utterance.onend = function() {
        currentUtterance = null;
        b.innerHTML = '\u25b6 \u64ad\u653e';
        b.classList.remove('speaking');
        status.textContent = '\u2713 \u64ad\u653e\u5b8c\u6210';
      };
      utterance.onerror = function() {
        currentUtterance = null;
        b.innerHTML = '\u25b6 \u64ad\u653e';
        b.classList.remove('speaking');
        status.textContent = '\u26a0 \u64ad\u653e\u5931\u8d25';
      };

      currentUtterance = utterance;
      this.innerHTML = '\u23f8 \u505c\u6b62';
      this.classList.add('speaking');
      status.textContent = '\u64ad\u653e\u4e2d...';
      synth.speak(utterance);
    });
  });
}

function bindToggle() {
  $exerciseContent.querySelectorAll('.recite-toggle').forEach(function(b) {
    b.addEventListener('click', function() {
      var idx = parseInt(this.dataset.idx);
      var el = document.getElementById('rt-' + idx);
      el.classList.toggle('hidden');
      this.textContent = el.classList.contains('hidden') ? '\u663e\u793a\u539f\u6587' : '\u9690\u85cf\u539f\u6587';
    });
  });
}

function bindExport() {
  $exerciseContent.querySelectorAll('.recite-export').forEach(function(b) {
    b.addEventListener('click', function() {
      var idx = parseInt(this.dataset.idx);
      var allPassages = getCurrentPassages();
      var p = allPassages[idx];
      if (!p) return;
      var text = p.title ? p.title + '\n\n' + p.text : p.text;
      var blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = ARTICLE_DATA.id + '-recitation-' + (idx+1) + '.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    });
  });
}

function bindDelete() {
  $exerciseContent.querySelectorAll('.recite-delete').forEach(function(b) {
    b.addEventListener('click', function() {
      var idx = parseInt(this.dataset.idx);
      var aiCount = (ARTICLE_DATA.exercises.recitation && ARTICLE_DATA.exercises.recitation.passages || []).length;
      var customIdx = idx - aiCount;
      if (customIdx < 0) return;
      var customKey = 'recite_custom_' + ARTICLE_DATA.id;
      var customPassages = [];
      try { var c = localStorage.getItem(customKey); if (c) customPassages = JSON.parse(c); } catch(e) {}
      customPassages.splice(customIdx, 1);
      localStorage.setItem(customKey, JSON.stringify(customPassages));
      renderRecitation();
    });
  });
}

function getCurrentPassages() {
  var aiPassages = ARTICLE_DATA.exercises.recitation && ARTICLE_DATA.exercises.recitation.passages || [];
  var customKey = 'recite_custom_' + ARTICLE_DATA.id;
  var customPassages = [];
  try { var c = localStorage.getItem(customKey); if (c) customPassages = JSON.parse(c); } catch(e) {}
  return aiPassages.concat(customPassages);
}
// ============================================================
// UTILS
// ============================================================
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================
// START
// ============================================================
init();
</script>
